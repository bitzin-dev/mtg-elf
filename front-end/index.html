
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal MTG - Gerenciador de Coleções</title>
    <link rel="icon" href="data:image/x-icon;base64,">
    <script>window.process = { env: { NODE_ENV: 'production' } }</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              portal: {
                bg: '#020604',
                panel: '#07120a',
                surface: '#0f1d14',
                border: '#1d3325',
                text: '#e5eee9',
                muted: '#8da096',
                accent: '#10b981',
                accentHover: '#34d399',
                gold: '#d6a84f',
                danger: '#ef4444',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Cinzel', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background:
          radial-gradient(circle at top left, rgba(16, 185, 129, 0.10), transparent 34rem),
          radial-gradient(circle at bottom right, rgba(214, 168, 79, 0.06), transparent 30rem),
          #020604;
      }
      .glass-panel {
        background: rgba(7, 18, 10, 0.78);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255,255,255,0.04);
        backdrop-filter: blur(18px);
      }
      .soft-card {
        background: linear-gradient(180deg, rgba(15, 29, 20, 0.88), rgba(7, 18, 10, 0.94));
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), 0 18px 48px rgba(0,0,0,0.22);
      }
      .portal-chip {
        background: rgba(255,255,255,0.055);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      }
      .portal-chip:hover {
        background: rgba(255,255,255,0.09);
      }
      .portal-menu {
        background: rgba(5, 14, 8, 0.94);
        box-shadow: 0 28px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
        backdrop-filter: blur(20px);
      }
      :focus-visible {
        outline: 2px solid #34d399;
        outline-offset: 2px;
      }
      
      /* Custom Scrollbar for dark theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #020604; 
      }
      ::-webkit-scrollbar-thumb {
        background: #1f2e25; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #374151; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "hono/": "https://esm.sh/hono@^4.11.4/",
    "hono": "https://esm.sh/hono@^4.11.4",
    "react-pageflip": "https://esm.sh/react-pageflip@2.0.3?external=react,react-dom"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-portal-bg text-portal-text antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
